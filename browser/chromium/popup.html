<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Linux Download Manager</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { width: 380px; max-height: 520px; background: #0f141c; color: #f0f4f8; overflow-x: hidden; overflow-y: auto; font-size: 13px; }
    header { padding: 12px 16px; background: #182232; border-bottom: 1px solid #28374d; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 10; }
    .brand { font-weight: 700; font-size: 13px; color: #fff; display: flex; align-items: center; gap: 6px; }
    .btn-clear { background: transparent; border: 1px solid #28374d; color: #8b9eb5; border-radius: 6px; padding: 4px 8px; cursor: pointer; font-size: 11px; }
    .btn-clear:hover { color: #fff; border-color: #3b506f; }
    .list { padding: 12px; display: flex; flex-direction: column; gap: 10px; }
    .card { background: #182232; border: 1px solid #28374d; border-radius: 10px; padding: 10px 12px; }
    .card-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
    .card-title { font-weight: 600; font-size: 12px; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 250px; }
    .card-btns { display: flex; align-items: center; gap: 4px; }
    .icon-btn { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); color: #a0aec0; border-radius: 6px; width: 26px; height: 26px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 12px; }
    .icon-btn:hover { color: #fff; background: rgba(255,255,255,0.15); }
    .bar-bg { width: 100%; height: 5px; background: rgba(255,255,255,0.08); border-radius: 999px; overflow: hidden; margin-bottom: 6px; }
    .bar-fill { height: 100%; background: linear-gradient(90deg, #00d287, #3dd29f); border-radius: 999px; transition: width 0.3s; }
    .bar-fill.paused { background: #ffa502; }
    .bar-fill.failed { background: #ff4757; }
    .card-stats { display: flex; align-items: center; justify-content: space-between; font-size: 11px; color: #8b9eb5; }
    .badge { padding: 2px 5px; border-radius: 4px; font-size: 10px; font-weight: 700; text-transform: uppercase; }
    .badge-downloading { background: rgba(0,210,135,0.15); color: #00d287; }
    .badge-paused { background: rgba(255,165,2,0.15); color: #ffa502; }
    .badge-completed { background: rgba(46,213,115,0.15); color: #2ed573; }
    .badge-failed { background: rgba(255,71,87,0.15); color: #ff4757; }
    .empty { text-align: center; padding: 40px 15px; color: #8b9eb5; font-size: 12px; }
  </style>
</head>
<body>
  <header>
    <div class="brand"><span style="color:#00d287;">⚡</span> Linux Download Manager</div>
    <div style="display:flex; gap:6px;">
      <button class="btn-clear" id="btn-clear" title="Geçmişi Temizle">🧹 Temizle</button>
      <button class="btn-clear" id="btn-open-tab" title="Tam Ekran">🌐 Panel</button>
    </div>
  </header>
  <div id="list" class="list">
    <div class="empty">Yükleniyor...</div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
